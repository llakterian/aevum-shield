[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Aevum Testnet — QDay Builder Challenge #1
# https://qday.io/builder-challenge
#
#   Chain ID      44005  (`cast chain-id` returns 0xabe5 = 44005)
#   RPC           https://rpc-test.qday.info
#   Explorer      https://explorer-test.qday.info
#   Gas currency  tQDAY
#   tUSD8         0x456569838f1d43009A91ebA4263147Afd7233483  (ERC-20, 6 dp)
#   Faucet        https://faucet.qday.info  (claim(address) is operator-only;
#                  the web UI is behind Cloudflare Turnstile)
#
# The RPC alias is in the [rpc_endpoints] section below because Foundry 1.x
# does not accept it as a profile key.

chain_id = 44005

# Polygon CDK based. Cancun is what the node reports; Prague is not enabled.
evm_version = "cancun"
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
# `block.timestamp` is used for invoice deadlines, the 24-hour dispute
# window, the 1-hour reservation TTL and the UTC day budget boundaries.
# A proposer can shift the timestamp by a few seconds; none of those
# windows are precise enough for that to matter. The warning is real in
# general, so it is switched off here rather than everywhere.
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
aevumws = "wss://rpc-test.qday.info"

[etherscan]
aevum = { key = "", url = "https://explorer-test.qday.info/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md
