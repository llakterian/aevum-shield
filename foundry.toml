[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Aevum Testnet — QDay Builder Challenge #1
# https://qday.io/builder-challenge
rpc_endpoints = {
    aevum = "https://rpc-test.qday.info",
    aevumws = "wss://rpc-test.qday.info",
}
chain_id = 44005
# Chain ID 44005 is QDay Aevum Testnet. `cast chain-id` against the RPC
# returns 0xabe5 = 44005, which is the check that the network is right.
# The tUSD8 test stablecoin is at 0x456569838f1d43009A91ebA4263147Afd7233483
# (ERC-20, 6 decimals).
tUSD8 = "0x456569838f1d43009A91ebA4263147Afd7233483"

# Polygon CDK based. Cancun is what the node reports; Prague is not enabled.
evm_version = "cancun"
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[etherscan]
aevum = { key = "", url = "https://explorer-test.qday.info/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md
